esphome:
  name: t65-keypad-s3
  friendly_name: T65 Keypad S3
  min_version: 2026.10.2

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [t65_keypad]

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# These pins are suitable for the generic ESP32-S3-DevKitC-1 definition.
# Verify the schematic for your exact flash/PSRAM/module and carrier variant.
t65_keypad:
  id: t65_s3
  rows: [GPIO4, GPIO5, GPIO6, GPIO7]
  columns: [GPIO15, GPIO16, GPIO17]
  debounce: 20ms
  on_key:
    - lambda: |-
        ESP_LOGI("t65", "Pressed: %c", x);

event:
  - platform: t65_keypad
    keypad_id: t65_s3
    name: T65 Keypad
